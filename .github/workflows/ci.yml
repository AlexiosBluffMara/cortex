name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.9.0"
      - name: ruff check
        run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    continue-on-error: true  # Advisory for now; tighten as the codebase stabilizes.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mypy
        run: pip install "mypy>=1.13.0" types-requests types-PyYAML
      - name: mypy
        run: mypy cortex hermes cli --ignore-missing-imports

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install minimal test deps (no torch, no TRIBE)
        run: |
          pip install --upgrade pip
          pip install \
            pytest pytest-asyncio pytest-mock pytest-timeout pytest-cov \
            requests numpy pandas
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=cortex --cov=hermes --cov=cli --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  smoke:
    name: Smoke import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps
        run: pip install requests numpy pandas
      - name: Verify all cortex modules import
        run: |
          python -c "from cortex import errors, config, logger, model_manager, gpu_scheduler, request_queue, media_processor, ollama_client, prompts, tiers"
          python -c "from cortex.errors import CortexError, ErrorCode, ErrorClass"
          python -c "from cortex.gpu_scheduler import GPUScheduler, GPUState"
          python -c "from cortex.request_queue import RequestQueue, RequestType"
          python -c "from cortex.job_store import JobStore, init_store, get_store"
          python -c "from cortex.job_scheduler import JobScheduler, get_scheduler, register_ws, unregister_ws"
