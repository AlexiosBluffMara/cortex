# ternary-gemma-e2b.yaml
# Quantization-aware training (QAT) config to take Gemma 4 e2b and turn it
# into a real BitNet b1.58 ternary model — weights constrained to
# {-1, 0, +1} with 8-bit activations — using the 5090 (32 GB GDDR7).
#
# Strategy: distill the original FP16 Gemma into a ternary student. KL
# divergence on token logits + cross-entropy on ground truth + small
# weight regulariser to keep the ternary projection stable.

teacher: /home/soumitty/cortex-baby-pi-work/gemma-4-e2b-hf  # FP16 frozen teacher (local)
student_init: /home/soumitty/cortex-baby-pi-work/gemma-4-e2b-hf  # student starts from same weights;
                                           # BitLinear modules will replace nn.Linear
                                           # before training begins.

# What gets ternarised. Embedding + LM head stay FP16 by convention
# (BitNet paper keeps these in higher precision — they're <5 % of weights
# but contribute disproportionately to perplexity).
ternarise:
  patterns:
    - "*.q_proj"
    - "*.k_proj"
    - "*.v_proj"
    - "*.o_proj"
    - "*.gate_proj"
    - "*.up_proj"
    - "*.down_proj"
  exclude:
    - "embed_tokens"
    - "lm_head"
    - "norm"
  weight_quant: "absmean_ternary"          # x = round(x / abs_mean(x)).clip(-1, 1)
  activation_quant: "per_token_int8"       # symmetric quant per token

# Distillation — disabled: 5090 32 GB can't hold teacher + bf16 student
# simultaneously. Pure CE on next-token works for QAT recovery; quality is
# worse than KL-distill but the model stays ternary which is the experiment.
distill:
  alpha_kl: 0.0
  alpha_ce: 1.0
  temperature: 2.0
  teacher_dtype: "bfloat16"
  freeze_teacher: true
  enabled: false

# Training corpus — high-quality mix to recover broad capability after
# ternarisation. Total ~500 M tokens, ~3-4 h on a 5090 at bs 4 / accum 4.
dataset:
  sources:
    - {name: "wikitext-103-raw-v1", subset: "train", weight: 0.30}
    - {name: "HuggingFaceFW/fineweb-edu", subset: "sample-10BT", weight: 0.40, max_examples: 200000}
    - {name: "bigcode/the-stack-smol", weight: 0.15, max_examples: 50000}
    - {name: "databricks/databricks-dolly-15k", weight: 0.10}
    - {name: "tatsu-lab/alpaca", weight: 0.05}
  max_seq_length: 512                        # tight — both teacher and student on 5090 32 GB
  format: "raw_text"

training:
  output_dir: "checkpoints/ternary-gemma-e2b"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16        # effective batch 16, single-sample microbatch fits 32 GB
  num_train_epochs: 1                    # 1 pass over the mix is enough for QAT recovery
  max_steps: 8000                        # ~1-1.5 h on 5090 at bs1 seq512 — proof-of-life QAT
  warmup_steps: 200
  learning_rate: 5.0e-5                  # low LR — we're recovering, not learning
  lr_scheduler_type: "cosine"
  weight_decay: 0.0                      # ternary weights are inherently regularised
  bf16: true
  fp16: false
  optim: "adamw_8bit"
  seed: 3407
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 2000
  eval_strategy: "steps"
  eval_steps: 1000
  gradient_checkpointing: true
  ddp_find_unused_parameters: false

# Export to bitnet.cpp's GGUF I2_S format for the Pi
export:
  format: "bitnet_i2s"
  output: "exports/ternary-gemma-e2b-i2s.gguf"
